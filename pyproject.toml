[project]
name = "igops"
version = "0.1.0"
description = "Semi-automated, compliant operations for one company-authorised Instagram brand account"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

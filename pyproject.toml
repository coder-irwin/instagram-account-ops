[project]
name = "igops"
version = "0.1.0"
description = "Semi-automated, compliant operations for one Instagram brand account"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "S603", "S607", "RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "E731", "B023", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

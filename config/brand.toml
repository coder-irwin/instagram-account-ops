# Sample brand configuration. GAJAN asked for a fully simulated environment
# (email of 19 October 2026); every value here is invented. See brand_kit/README.md.
# This file holds no secrets: only vault references (vault://...) and non-secret facts.

mode = "simulation"            # "simulation" (no real Instagram calls) or "live"

[brand]
key = "monsoon-threads"
name = "Monsoon Threads"
company_domain = "monsoonthreads.example"
website = "https://monsoonthreads.example"
category = "Clothing (Brand)"
bio = "Handloom cotton for warm days and wet ones. Made in small batches with weavers we know by name. New drops every month."
profile_image = "brand_kit/logo.png"

[vault]
backend = "local"              # encrypted local file; "hashicorp" and "1password" adapters also exist

[ops]
owner = "owner.a@monsoonthreads.example"         # Owner A: owns human tasks
escalate_to = "ops.lead@monsoonthreads.example"  # Ops Lead: receives escalations
signup_due_hours = 24
task_due_hours = 24
stale_access_days = 90
stale_verification_days = 7

[company_contacts]
# Company-controlled recovery details. Anything else is flagged by the audit.
phones = ["+1 555 0142 001"]

[meta]
business_id = "SIMULATED-BUSINESS-001"
ig_user_id = ""
token_ref = "vault://monsoon-threads/meta/system_user_token"

# People and the least-privilege role each needs.
[[people]]
email = "owner.a@monsoonthreads.example"
name = "Owner A"
roles = { business_suite = "admin" }

[[people]]
email = "editor.c@monsoonthreads.example"
name = "Editor C"
roles = { business_suite = "content_editor" }

[[people]]
email = "owner.b@monsoonthreads.example"         # Owner B (leaving): the offboarding run targets them
name = "Owner B (leaving)"
test_member = true
roles = { business_suite = "insights_viewer" }    # designated temporary, least-privilege role
vault_access = ["password", "backup_codes"]       # what they could read, so both get rotated

[[proxies]]
name = "proxy-a"
url_ref = "vault://monsoon-threads/proxy/a"       # local test proxy; value http://user:pass@127.0.0.1:port
[[proxies]]
name = "proxy-b"
url_ref = "vault://monsoon-threads/proxy/b"

[proxy_policy]
# Public neutral endpoint (httpbin.org echoes request headers, so we can see which proxy carried
# the request). /status/403 stands in for a security challenge. Falls back to a local endpoint offline.
neutral_endpoint = "http://httpbin.org/headers"
challenge_path = "status/403"
connect_timeout_s = 3
read_timeout_s = 5
max_retries = 3
health_interval_s = 60
